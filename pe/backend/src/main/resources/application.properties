spring.application.name=student-forum
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
app.moderator.username=${MODERATOR_USERNAME}
app.moderator.password=${MODERATOR_PASSWORD}
app.student.username=${STUDENT_USERNAME}
app.student.password=${STUDENT_PASSWORD}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_forum?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

huggingface.api.token=${HF_API_TOKEN:hf_YOUR_DEFAULT_TOKEN_HERE}
huggingface.toxicity.url=${HF_TOXICITY_URL:https://router.huggingface.co/hf-inference/models/unitary/toxic-bert}
huggingface.subject.url=${HF_SUBJECT_URL:https://router.huggingface.co/hf-inference/models/facebook/bart-large-mnli}
